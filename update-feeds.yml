name: Update feeds (Substack + YouTube)
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  feeds:
    runs-on: ubuntu-latest
    env:
      YT_CHANNEL_ID: "UCZCMfPUFytpl1MugojZOzZQ"
      SUBSTACK: "https://feralamerica.substack.com"
      SECTION_MATCH: "project-545"
    steps:
      - uses: actions/checkout@v4
      - name: Build feeds JSON
        run: |
          python3 - <<'PY'
          import urllib.request, json, re, html, os, datetime, traceback

          UA={'User-Agent':'Mozilla/5.0 (feed-bot)'}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=40).read().decode('utf-8','ignore')

          articles=[]
          videos=[]

          # ---------- Substack ----------
          try:
              sub=get(os.environ['SUBSTACK'].rstrip('/')+'/feed')
              items=re.findall(r'<item>(.*?)</item>', sub, re.S)
              match=os.environ.get('SECTION_MATCH','').lower().strip()
              def tag(block,t):
                  m=re.search(r'<%s>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</%s>'%(t,t), block, re.S)
                  return html.unescape(m.group(1).strip()) if m else ''
              def build(it):
                  link=tag(it,'link'); title=tag(it,'title'); date=tag(it,'pubDate')
                  body=tag(it,'description') or tag(it,'content:encoded')
                  text=re.sub(r'<[^>]+>',' ',body); text=re.sub(r'\s+',' ',text).strip()
                  summary=(text[:280]+'...') if len(text)>280 else text
                  return dict(title=title,link=link,date=date,summary=summary)
              # first pass: keep only section matches
              matched=[]
              for it in items:
                  cats=' '.join(re.findall(r'<category>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</category>', it, re.S)).lower()
                  link=tag(it,'link').lower()
                  if match and (match in cats or match in link):
                      matched.append(build(it))
              # fallback: if nothing matched the section, show all posts (better than empty)
              if not matched:
                  for it in items:
                      link=tag(it,'link')
                      if link and 'substack.com' in link and tag(it,'title'):
                          matched.append(build(it))
              articles=[a for a in matched if a.get('title') and a.get('link')][:25]
          except Exception as e:
              print('Substack step error (continuing):', e)
              traceback.print_exc()

          # ---------- YouTube ----------
          try:
              cid=os.environ.get('YT_CHANNEL_ID','').strip()
              if cid and not cid.startswith('UCXXXX'):
                  x=get('https://www.youtube.com/feeds/videos.xml?channel_id='+cid)
                  for m in re.findall(r'<entry>(.*?)</entry>', x, re.S)[:5]:
                      vid=re.search(r'<yt:videoId>([^<]+)', m)
                      ttl=re.search(r'<title>([^<]+)', m)
                      if vid:
                          videos.append(dict(id=vid.group(1), title=html.unescape(ttl.group(1)) if ttl else ''))
              else:
                  print('YouTube channel ID not set yet; skipping videos.')
          except Exception as e:
              print('YouTube step error (continuing):', e)
              traceback.print_exc()

          # ---------- always write a valid file ----------
          out=dict(articles=articles, videos=videos,
                   updated=datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'))
          json.dump(out, open('feeds.json','w'), indent=1)
          print('WROTE feeds.json  articles=%d videos=%d' % (len(articles), len(videos)))
          PY
      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feeds.json
          git diff --cached --quiet || git commit -m "Update feeds.json (auto)"
          git push
