name: Update mesh metrics (weekly crawl)
on:
  schedule:
    - cron: "41 8 * * 1"   # Mondays 08:41 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crawl mesh + count
        run: |
          python3 - <<'PY'
          import urllib.request, json, re, time, datetime
          UA={'User-Agent':'Mozilla/5.0 (metrics-bot)'}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=40).read()
          SITES=["allyvia","cognitura","justorium","paxpoint","culturavia","innovascope","econora","compassionpulse","factsignal"]
          data={}
          total_posts=0
          for s in SITES:
              rec=dict(posts=None, byline=None, xref={})
              try:
                  r=urllib.request.urlopen(urllib.request.Request(f"https://{s}.org/wp-json/wp/v2/posts?per_page=1",headers=UA),timeout=30)
                  rec['posts']=int(r.headers.get('X-WP-Total','0'))
                  total_posts+=rec['posts'] or 0
              except Exception as e: rec['err']=str(e)[:40]
              # byline from one post
              try:
                  j=json.load(urllib.request.urlopen(urllib.request.Request(f"https://{s}.org/wp-json/wp/v2/posts?per_page=1&_fields=link",headers=UA),timeout=30))
                  if j:
                      h=get(j[0]['link']).decode('utf-8','ignore')
                      m=re.search(r'<meta name="author" content="([^"]+)"',h)
                      rec['byline']=m.group(1) if m else None
              except Exception as e: pass
              # cross-refs: count sibling-domain mentions in the homepage
              try:
                  h=get(f"https://{s}.org/").decode('utf-8','ignore').lower()
                  for o in SITES:
                      if o!=s:
                          n=h.count(o+'.org')
                          if n: rec['xref'][o]=n
              except Exception as e: pass
              data[s]=rec
              time.sleep(2)
          bylines=set(v.get('byline') for v in data.values() if v.get('byline'))
          out=dict(sites=data, total_posts=total_posts, unique_bylines=sorted(bylines),
                   site_count=len(SITES), updated=datetime.datetime.utcnow().strftime('%Y-%m-%d'))
          json.dump(out, open('metrics.json','w'), indent=1)
          print('total posts:',total_posts,'bylines:',bylines)
          PY
      - name: Commit if changed
        run: |
          git config user.name "metrics-bot"; git config user.email "actions@users.noreply.github.com"
          git add metrics.json
          git diff --cached --quiet || git commit -m "Update mesh metrics (auto)"
          git push
